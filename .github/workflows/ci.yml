name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t diagnostics:ci .
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint deploy/helm/diagnostics --set image.repository=diagnostics --set image.tag=ci --set appUrl=https://diagnostics.example.com --set oidc.issuer=https://id.example.com/realms/diagnostics
