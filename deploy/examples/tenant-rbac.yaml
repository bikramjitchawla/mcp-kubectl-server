# Apply once per tenant namespace; replace team-a for other teams.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostics-reader
  namespace: team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diagnostics-reader
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, persistentvolumeclaims, configmaps]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnostics-reader
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diagnostics-reader
subjects:
  - kind: ServiceAccount
    name: diagnostics-reader
    namespace: team-a
