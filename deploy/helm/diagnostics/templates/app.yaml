apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: diagnostics
          image: "{{ required "Set image.repository" .Values.image.repository }}:{{ required "Set an immutable image.tag" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: NODE_ENV, value: production }
            - { name: APP_URL, value: {{ required "Set the HTTPS appUrl" .Values.appUrl | quote }} }
            - { name: OIDC_ISSUER, value: {{ required "Set oidc.issuer" .Values.oidc.issuer | quote }} }
            - { name: OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }} }
            - { name: OIDC_GROUPS_CLAIM, value: {{ .Values.oidc.groupsClaim | quote }} }
            - { name: OIDC_SCOPES, value: {{ .Values.oidc.scopes | quote }} }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
            - { name: TENANTS_CONFIG_FILE, value: /etc/diagnostics/config/tenants.json }
            - { name: DIAGNOSTICS_DATA_DIR, value: /app/.data }
          {{- if .Values.integrationSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.integrationSecret }} }
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /etc/diagnostics/config, readOnly: true }
            - { name: credentials, mountPath: /etc/diagnostics/credentials, readOnly: true }
            - { name: data, mountPath: /app/.data }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret: { secretName: {{ .Values.tenantsSecret }}, defaultMode: 0440 }
        - name: credentials
          secret: { secretName: {{ .Values.credentialsSecret }}, defaultMode: 0440 }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
