{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports: [{ protocol: TCP, port: 3000 }]
# Egress destinations depend on the user's API servers, IdP, GitHub and optional
# metrics/AI providers. Add installation-specific egress policies separately.
{{- end }}
