# Prefer creating Secrets from protected files as described in docs/SELF-HOSTING.md.
# Never put real credentials in this example or commit a populated secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: diagnostics-oidc
  namespace: mcp-diagnostics
type: Opaque
stringData:
  client-secret: REPLACE_OUTSIDE_GIT
# Also provision diagnostics-tenants (tenants.json) and diagnostics-credentials
# (one kubeconfig per tenant). There is no anonymous/shared-key deployment mode.
